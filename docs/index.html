<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YS Store</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Noto Nastaliq Urdu", sans-serif; background:#fff; color:#202124; }
  header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid #e0e0e0; position:sticky; top:0; background:#fff; z-index:5; }
  .logo { width:44px; height:44px; border-radius:12px; background:#01875F; color:#fff; font-weight:700; font-size:19px; display:flex; align-items:center; justify-content:center; }
  header h1 { font-size:21px; }
  header .sub { font-size:12px; color:#5f6368; }
  main { max-width:560px; margin:0 auto; padding:20px 18px 40px; }
  .app-head { display:flex; gap:16px; align-items:center; }
  .app-head img { width:88px; height:88px; border-radius:20px; object-fit:contain; }
  .app-head .nm { font-size:24px; font-weight:700; }
  .app-head .dev { color:#01875F; font-size:14px; margin-top:2px; }
  .app-head .cat { color:#5f6368; font-size:13px; }
  .strip { display:flex; margin:20px 0 6px; border-top:1px solid #eee; border-bottom:1px solid #eee; }
  .strip div { flex:1; text-align:center; padding:10px 4px; }
  .strip b { display:block; font-size:14px; }
  .strip span { font-size:11px; color:#5f6368; }
  .update-btn { display:block; text-align:center; background:#01875F; color:#fff; font-size:18px; font-weight:700;
    padding:15px; border-radius:26px; text-decoration:none; margin:18px 0 10px; }
  .update-btn small { display:block; font-size:13px; font-weight:400; opacity:.9; margin-top:2px; }
  .open-app { display:block; text-align:center; color:#01875F; font-weight:700; font-size:15px; padding:11px;
    border:1px solid #e0e0e0; border-radius:26px; text-decoration:none; margin-bottom:22px; }
  h2 { font-size:17px; margin:22px 0 8px; }
  p.desc { font-size:14px; color:#3c4043; line-height:1.65; }
  p.ur { direction:rtl; text-align:right; font-size:15px; }
  .verified { display:inline-block; background:#E6F4EA; color:#01875F; font-weight:700; font-size:13px;
    padding:7px 14px; border-radius:16px; margin-top:14px; }
  .center { text-align:center; color:#5f6368; padding:48px 0; font-size:15px; line-height:1.8; }
  footer { text-align:center; color:#9aa0a6; font-size:12px; padding:18px; border-top:1px solid #eee; }
</style>
</head>
<body>
<header>
  <div class="logo">YS</div>
  <div>
    <h1>YS Store</h1>
    <div class="sub">by Muhammad Yousuf <span id="storeVer"></span></div>
  </div>
</header>
<main id="main">
  <div class="center" id="loading">Loading…<br><span dir="rtl">لوڈ ہو رہا ہے…</span></div>
</main>
<footer>YS Store — All YS apps in one place • <span dir="rtl">تمام YS ایپس ایک ہی جگہ</span></footer>

<script>
var CATALOG_URL = "https://raw.githubusercontent.com/yousuf0313/YS-Store/main/apps.json";

function fmtSize(bytes) {
  if (!bytes) return "";
  var mb = bytes / 1048576;
  if (mb >= 1) return mb.toFixed(1) + " MB";
  return Math.round(bytes / 1024) + " KB";
}
function esc(t) {
  return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

fetch(CATALOG_URL, { cache: "no-store" })
  .then(function(r) { if (!r.ok) throw new Error("catalog"); return r.json(); })
  .then(function(cat) {
    var app = (cat.apps || [])[0];
    if (!app) throw new Error("empty");
    if (cat.store && cat.store.versionName) {
      document.getElementById("storeVer").textContent = "• v" + cat.store.versionName;
    }
    var size = app.sizeBytes ? fmtSize(app.sizeBytes) : (app.size || "");
    var rating = app.rating ? "★ " + app.rating : "—";
    var icon = app.icon || "";
    var html = "";
    html += '<div class="app-head">'
      + (icon ? '<img src="' + esc(icon) + '" alt="' + esc(app.name) + ' logo">' : '')
      + '<div><div class="nm">' + esc(app.name) + '</div>'
      + '<div class="dev">Muhammad Yousuf</div>'
      + '<div class="cat">' + esc(app.category || "") + ' • ' + esc(app.categoryUr || "") + '</div></div></div>';
    html += '<div class="strip">'
      + '<div><b>v' + esc(app.versionName || "") + '</b><span>Version • ورژن</span></div>'
      + '<div><b>' + esc(size) + '</b><span>Size • سائز</span></div>'
      + '<div><b>' + esc(rating) + '</b><span>Rating • درجہ</span></div></div>';
    if (app.sha256 && app.signerSha256) {
      html += '<div><span class="verified">YS Verify ✓ — This app is verified • <span dir="rtl">یہ ایپ تصدیق شدہ ہے</span></span></div>';
    }
    html += '<a class="update-btn" href="' + esc(app.apkUrl || "#") + '">UPDATE'
      + '<small><span dir="rtl">اپڈیٹ کریں — یہیں سے ڈاؤن لوڈ اور انسٹال کریں</span></small></a>';
    html += '<a class="open-app" href="ysstore://app/' + esc(app.id || "") + '">Open in YS Store app • <span dir="rtl">YS Store ایپ میں کھولیں</span></a>';
    html += '<h2>About • <span dir="rtl">اس ایپ کے بارے میں</span></h2>'
      + '<p class="desc">' + esc(app.descEn || "") + '</p>'
      + '<p class="desc ur" lang="ur">' + esc(app.descUr || "") + '</p>';
    html += '<h2>What\'s new • <span dir="rtl">نیا کیا ہے</span></h2>'
      + '<p class="desc">' + esc(app.newEn || "") + '</p>'
      + '<p class="desc ur" lang="ur">' + esc(app.newUr || "") + '</p>';
    document.getElementById("main").innerHTML = html;
    document.title = app.name + " — YS Store";
  })
  .catch(function() {
    document.getElementById("main").innerHTML =
      '<div class="center">Could not load the store. Please check your internet and try again.<br>' +
      '<span dir="rtl">اسٹور لوڈ نہیں ہو سکا — انٹرنیٹ چیک کر کے دوبارہ کوشش کریں۔</span></div>';
  });
</script>
</body>
</html>
